# Manual-only probe: can Claude running in GitHub Actions (subscription OAuth
# token) see the claude.ai Dock connector? Decides whether the Dock sweep can
# run here instead of on a laptop. Safe: read-only, no Dock calls are made.
name: Dock connector probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List MCP servers visible to Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npx -y @anthropic-ai/claude-code@latest mcp list || true
      - name: Ask Claude which Dock tools it has
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npx -y @anthropic-ai/claude-code@latest -p "Reply with only a comma-separated list of the names of every tool available to you whose name contains 'Dock' or 'dock'. If none, reply NONE." --max-turns 2 < /dev/null || true
