# Independent safety net for the Dock workspace builder (cloud routine
# "Dock workspace for new partner meetings"). No Claude involved.
#
# Primary trigger is EVENT-DRIVEN, not a clock: every time "Process meeting
# (webhook)" finishes, this waits 90 minutes, then checks that each recent
# meeting card got its Dock workspace, posting once in the meeting's Slack
# thread if not. (11 Sep 2026: GitHub's cron on this repo ran hours late or
# never, and Cloudflare Cron Triggers on the account never fired, so no
# scheduler is relied on.) The public repo means the wait costs nothing.
# The cron / Cloudflare dispatch / manual triggers remain as extra sweeps.
name: Dock watchdog
on:
  workflow_run:
    workflows: ["Process meeting (webhook)"]
    types: [completed]
  repository_dispatch:
    types: [dock_watchdog]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Give the builder 90 minutes after a meeting is processed
        if: github.event_name == 'workflow_run'
        run: sleep 5400
      - name: Alert on meetings still missing a Dock workspace
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python3 .github/scripts/dock_watchdog.py --min-age 90
