name: Fire the Dock builder now
# Manual "build now" button: wakes the claude.ai routine "Dock workspace for
# new partner meetings v2" through its API trigger. The meeting pipeline calls
# the same endpoint automatically after each card; this exists for replays and
# for checking that ROUTINE_FIRE_TOKEN still works.
on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional context passed to the routine"
        required: false
        default: "Manual fire from GitHub Actions"

jobs:
  fire:
    runs-on: ubuntu-latest
    steps:
      - name: POST /fire
        env:
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          ROUTINE_ID: trig_017ZhhiBcXFbvxA6AJfGaFGk
          NOTE: ${{ github.event.inputs.note }}
        run: |
          [ -n "$ROUTINE_FIRE_TOKEN" ] || { echo "::error::ROUTINE_FIRE_TOKEN is not set"; exit 1; }
          CODE=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST \
            "https://api.anthropic.com/v1/claude_code/routines/${ROUTINE_ID}/fire" \
            -H "Authorization: Bearer ${ROUTINE_FIRE_TOKEN}" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$(printf '{"text":"%s"}' "$NOTE")")
          echo "routine fire -> HTTP $CODE"
          sed 's/"session_url":"[^"]*"/"session_url":"<url>"/' /tmp/out | head -c 400; echo
          case "$CODE" in 2*) ;; *) exit 1 ;; esac
